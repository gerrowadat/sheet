name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build binaries
        run: |
          mkdir -p dist
          PLATFORMS=(
            "linux/amd64"
            "linux/arm64"
            "linux/arm"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )
          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS="${PLATFORM%/*}"
            GOARCH="${PLATFORM#*/}"
            OUTPUT="dist/sheet-${GOOS}-${GOARCH}"
            [ "$GOOS" = "windows" ] && OUTPUT="${OUTPUT}.exe"
            GOOS="$GOOS" GOARCH="$GOARCH" go build -v -o "$OUTPUT" .
          done

      - name: Create release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
